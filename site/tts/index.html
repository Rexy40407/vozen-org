<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070d" />
    <meta name="description" content="Vozen TTS for Discord." />
    <link rel="canonical" href="https://vozen.org/tts/" />
    <title>Vozen TTS</title>
    <style>body{margin:0;background:#07070d;color:#f6f8ff;font:16px system-ui,sans-serif}.route-loading{display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center;color:#bac3dc}.route-loading strong{display:block;color:#fff;margin-bottom:8px}</style>
  </head>
  <body>
    <main class="route-loading" aria-live="polite"><div><strong>Loading Vozen TTS</strong><span>Preparing the voice experience.</span></div></main>
    <script>
      (async () => {
        const response = await fetch('../tts.html');
        if (!response.ok) throw new Error('The TTS page could not be loaded.');
        let source = await response.text();
        source = source
          .replace(/<head([^>]*)>/i, '<head$1><base href="../">')
          .replaceAll('https://vozen.org/tts.html', 'https://vozen.org/tts/');
        document.open();
        document.write(source);
        document.close();
      })().catch((error) => {
        document.querySelector('.route-loading').innerHTML = '<div><strong>Vozen TTS could not load.</strong><span>Please refresh this page and try again.</span></div>';
        console.error(error);
      });
    </script>
  </body>
</html>
