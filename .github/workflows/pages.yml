name: Deploy vozen.org

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs-src/**'
      - 'docs-data/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.eleventy.cjs'
      - 'apps/helper-panel/**'
      - 'tools/install-helper-panel.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vozen-org-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/helper-panel/package-lock.json
      - name: Build Helper documentation
        run: |
          npm ci
          npm run docs:build
          npm run docs:test
          npm run docs:links
          npm run docs:a11y
          npm run site:check
      - name: Build Helper panel
        run: |
          npm ci --prefix apps/helper-panel
          npm run build --prefix apps/helper-panel
          node tools/install-helper-panel.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
