name: Deploy vozen.org

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs-src/**'
      - 'docs-data/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.eleventy.cjs'
      - 'apps/helper-panel/**'
      - 'tools/install-helper-panel.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vozen-org-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/helper-panel/package-lock.json
      - name: Build Helper documentation
        run: |
          npm ci
          npm run docs:build
          npm run docs:test
          npm run docs:links
          npm run docs:a11y
          npm run site:check
      - name: Build Helper panel
        run: |
          npm ci --prefix apps/helper-panel
          npm run build --prefix apps/helper-panel
          node tools/install-helper-panel.mjs
      - name: Publish site to GitHub Pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"

          git init "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git -C "$publish_dir" fetch origin gh-pages; then
            git -C "$publish_dir" checkout -b gh-pages FETCH_HEAD
          else
            git -C "$publish_dir" checkout --orphan gh-pages
          fi

          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. "$publish_dir"/
          git -C "$publish_dir" add -A

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git -C "$publish_dir" commit -m "deploy: ${GITHUB_SHA}"
            git -C "$publish_dir" push origin gh-pages
          fi
