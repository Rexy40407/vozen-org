name: Deploy vozen.org

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs-src/**'
      - 'docs-data/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.eleventy.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vozen-org-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:test
      - run: npm run docs:links
      - run: npm run docs:a11y
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
