name: Deploy vozen.org

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs-src/**'
      - 'docs-data/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.eleventy.cjs'
      - 'apps/helper-panel/**'
      - 'tools/install-helper-panel.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vozen-org-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/helper-panel/package-lock.json
      - name: Build Helper documentation
        run: |
          npm ci
          npm run docs:build
          npm run docs:test
          npm run docs:links
          npm run docs:a11y
          npm run site:check
      - name: Build Helper panel
        run: |
          npm ci --prefix apps/helper-panel
          npm run build --prefix apps/helper-panel
          node tools/install-helper-panel.mjs
          node tools/release-artifact-check.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
